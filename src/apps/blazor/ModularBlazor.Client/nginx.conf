server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enable correct MIME types for Blazor WebAssembly
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        application/octet-stream dll;
    }

    gzip on;
    gzip_types application/javascript application/json text/css application/wasm application/octet-stream;

    # Modules: served exactly as stored. No compression or transforms (the client reads the raw bytes), no SPA
    # fallback (a missing module must be a 404, not index.html), and never cached stale (they change when rebuilt).
    location ^~ /modules/ {   # ^~ so the .dll regex location below cannot take these over
        gzip off;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Single-page app: any unknown path (e.g. /reports) returns index.html and Blazor routes it.
    # Real files (framework, modules/*.dll, modules/*.nupkg, css) are served as they are.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Handle static compression assets correctly if enabled
    location ~* \.(wasm|dll)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Prevent Blazor DevTools bridge timeout/format errors on fallback maps
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
