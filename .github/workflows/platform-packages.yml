# Packs the platform's NuGet packages (the contracts modules compile against, and the Module SDK) with
# build/pack-platform.ps1, in one version:
#   - push / pull request:  1.0.0-ci.<run>   packed and kept as a workflow artifact, not published
#   - tag v1.2.0:           1.2.0            published
#   - manual run:           1.0.0-ci.<run>   published (a preview for module developers)
# Published to GitHub Packages (https://nuget.pkg.github.com/soft-square-net/index.json) with the workflow's own token,
# and to nuget.org as well when the repository has a NUGET_API_KEY secret.
name: Platform packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            ./build/pack-platform.ps1 -Output artifacts/packages -Version $env:GITHUB_REF_NAME.Substring(1)
          } else {
            ./build/pack-platform.ps1 -Output artifacts/packages -VersionSuffix "ci.$env:GITHUB_RUN_NUMBER"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: platform-packages
          path: artifacts/packages/*

      - name: Publish to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate

      - name: Publish to nuget.org
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key "$NUGET_API_KEY"
          --skip-duplicate
